<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>光体智造</title>
    <script type="module" crossorigin="" src="./assets/index-DFFo0xIT.js"></script>
    <link rel="stylesheet" crossorigin="" href="./assets/index-r0MsgBs6.css"/>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d4af37'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23000' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23000'/%3E%3C/svg%3E"/>
    <style>
    /* ========== 光体智造 移动端适配修复层（仅 <768px 生效，不影响桌面端） ========== */
    @media (max-width: 768px) {
      html, body { overflow-x: hidden !important; max-width: 100vw !important; }
      /* 顶栏：压缩内边距，桌面链接行隐藏，由汉堡菜单接管 */
      nav { padding: 0 14px !important; height: 58px !important; }
      nav > div:nth-of-type(2) { display: none !important; }
      nav > div:nth-of-type(3) { gap: 10px !important; }
      nav > div:nth-of-type(3) > button:first-of-type { padding: 6px 12px !important; font-size: 12px !important; }
      /* 禁止顶栏文字折行 */
      nav span[style*="font-size: 20px"] { white-space: nowrap !important; font-size: 17px !important; }
      nav span[style*="font-size: 10px"] { white-space: nowrap !important; }
      nav button { white-space: nowrap !important; }
      nav > div:first-of-type { flex-shrink: 0 !important; }
      /* 汉堡按钮（JS 注入） */
      #gt-mobile-btn { display: flex !important; align-items: center; justify-content: center; width: 38px; height: 38px; background: none; border: none; cursor: pointer; padding: 0; position: relative; }
      #gt-mobile-btn span { display: block; width: 20px; height: 2px; background: #fff; margin: 2.5px 0; flex-shrink: 0; }
      #gt-mobile-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      #gt-mobile-btn.open span:nth-child(2) { opacity: 0; }
      #gt-mobile-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
      /* 全屏抽屉菜单 */
      #gt-mobile-menu { position: fixed; top: 58px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.96); backdrop-filter: blur(12px); z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; opacity: 0; pointer-events: none; transition: opacity .3s; }
      #gt-mobile-menu.open { opacity: 1; pointer-events: auto; }
      #gt-mobile-menu a { color: rgba(255,255,255,.85); font-size: 20px; font-weight: 500; text-decoration: none; padding: 12px 24px; letter-spacing: .1em; }
      #gt-mobile-menu a:active { color: #00bfff; }
      /* 板块内边距写死 140px 60px → 小屏收紧 */
      section[style*="padding: 140px 60px"] { padding: 72px 18px !important; }
      /* 网格自适应：4列→2列，3列→2列，2列→1列 */
      div[style*="grid-template-columns: repeat(4"] { grid-template-columns: repeat(2, 1fr) !important; }
      div[style*="grid-template-columns: repeat(3"] { grid-template-columns: repeat(2, 1fr) !important; }
      div[style*="grid-template-columns: repeat(2"] { grid-template-columns: 1fr !important; }
      /* 大字号标题在小屏收紧 */
      h2[style*="clamp(36px"] { font-size: 30px !important; }
      /* 页脚：双栏网格 → 单栏，底栏允许换行 */
      footer div[style*="grid-template-columns: 1.2fr 1fr"] { grid-template-columns: 1fr !important; gap: 48px !important; }
      footer span[style*="font-size: 16px"] { white-space: nowrap !important; }
      footer span[style*="font-size: 10px"] { white-space: nowrap !important; }
      footer > div > div:last-child { flex-wrap: wrap !important; gap: 12px !important; }
      footer input { flex: 1 !important; width: 100% !important; min-width: 0 !important; }
    }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script>
    (function () {
      var LINKS = [
        ['#products', '光体商城'],
        ['#scenarios', '场景套装'],
        ['#quiz', '智慧测评'],
        ['#techdecode', '科技解码'],
        ['#traceability', '智造溯源'],
        ['#energy', '能量站'],
        ['#membership', '会员']
      ];
      function isMobile() { return window.matchMedia('(max-width: 768px)').matches; }
      function boot() {
        var nav = document.querySelector('nav');
        if (!nav || document.getElementById('gt-mobile-btn')) return;
        var actions = nav.children[2];
        if (!actions) return;
        // 汉堡按钮
        var btn = document.createElement('button');
        btn.id = 'gt-mobile-btn';
        btn.setAttribute('aria-label', '菜单');
        btn.innerHTML = '<span></span><span></span><span></span>';
        btn.style.display = 'none';
        actions.insertBefore(btn, actions.firstChild);
        // 抽屉菜单
        var menu = document.createElement('div');
        menu.id = 'gt-mobile-menu';
        menu.innerHTML = LINKS.map(function (l) {
          return '<a href="' + l[0] + '">' + l[1] + '</a>';
        }).join('');
        document.body.appendChild(menu);
        function toggle(open) {
          var willOpen = open === undefined ? !menu.classList.contains('open') : open;
          menu.classList.toggle('open', willOpen);
          btn.classList.toggle('open', willOpen);
          document.body.style.overflow = willOpen ? 'hidden' : '';
        }
        btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
        menu.addEventListener('click', function (e) {
          var a = e.target.closest('a');
          if (!a) return;
          e.preventDefault();
          toggle(false);
          var target = document.querySelector(a.getAttribute('href'));
          if (target) setTimeout(function () { target.scrollIntoView({ behavior: 'smooth' }); }, 120);
        });
        window.matchMedia('(max-width: 768px)').addEventListener('change', function (ev) { if (!ev.matches) toggle(false); });
      }
      // React 渲染是异步的，轮询等待 nav 出现
      var timer = setInterval(function () {
        if (document.querySelector('nav')) { clearInterval(timer); boot(); }
      }, 200);
      setTimeout(function () { clearInterval(timer); }, 15000);
    })();
    </script>
  </body></html>
