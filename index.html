        sec.appendChild(wrap);

        /* 加入弹窗 */
        var modal = own(el('<div class="gt-modal"><h4>加入光体•智造会员</h4><p>填写手机号即可完成注册，权益即时生效</p><input type="tel" maxlength="11" placeholder="请输入 11 位手机号"><button class="gt-join-submit">确认加入</button></div>'));
        document.body.appendChild(modal);
        var currentTier = '悦享会员';
        function closeModal() { modal.classList.remove('open'); if (mask) mask.classList.remove('open'); }
        function openJoin(tier) {
          currentTier = tier;
          modal.querySelector('h4').textContent = '加入「' + tier + '」';
          modal.classList.add('open'); if (mask) mask.classList.add('open');
        }
        var wireT = setInterval(function () { if (mask) { mask.addEventListener('click', closeModal); clearInterval(wireT); } }, 300);
        setTimeout(function () { clearInterval(wireT); }, 12000);
        modal.querySelector('.gt-join-submit').addEventListener('click', function () {
          var phone = modal.querySelector('input').value.trim();
          if (!/^1\d{10}$/.test(phone)) { toast('请输入正确的 11 位手机号'); return; }
          try { localStorage.setItem('gt-member', JSON.stringify({ phone: phone, tier: currentTier, at: Date.now() })); } catch (e) {}
          modal.classList.remove('open'); mask && mask.classList.remove('open');
          membered.style.display = '';
          membered.querySelector('b').textContent = phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
          toast('🎉 欢迎加入「' + currentTier + '」，权益已生效');
        });
        return true;
      }

      /* ---------- 轮询等待 React 渲染完成后初始化 ---------- */
      var done = { car: false, shop: false, mem: false, cart: false };
      var poll = setInterval(function () {
        if (!done.cart && document.querySelector('nav')) { buildCartUI(); done.cart = true; }
        if (!done.car) done.car = buildCarousel();
        if (!done.shop) done.shop = buildShop();
        if (!done.mem) done.mem = buildMember();
        if (done.car && done.shop && done.mem && done.cart) clearInterval(poll);
      }, 400);
      setTimeout(function () { clearInterval(poll); }, 25000);
    })();
    </script>
  </body></html>
