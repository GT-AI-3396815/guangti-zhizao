      /* ---- 弹窗框架 ---- */
      var mask4 = null, modal4 = null;

        mask4.addEventListener('click', closeAll);
        modal4.querySelector('.gt4-x').addEventListener('click', closeAll);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });
      }
      function closeAll() {
        if (mask4) mask4.classList.remove('open');
        if (modal4) modal4.classList.remove('open');
        document.body.style.overflow = '';
      }
      function openModal(html, after) {
        ensureFrame();
        modal4.querySelector('.gt4-body').innerHTML = html;
        modal4.classList.add('open'); mask4.classList.add('open');
        document.body.style.overflow = 'hidden';
        if (after) after(modal4);

      /* ---- 详情弹窗 ---- */

          '<div class="gt4-info"><h4>' + displayName + '</h4>' +
          '<div class="gt4-pricerow"><span class="gt4-price">¥' + d.price.toLocaleString() + '</span>' + (d.orig ? '<span class="gt4-orig">市场参考价 ¥' + d.orig.toLocaleString() + '</span>' : '') + saveTxt + '</div>' +
          '<div class="gt4-svc"><span>顺丰包邮（满 ¥399）</span><span>七天无理由退换</span><span>48 小时内发货</span><span>' + (displayName.indexOf('收藏') > -1 ? '终身工艺保障' : '两年质保') + '</span></div>' +
          '<ul class="gt4-hl">' + d.hl.map(function (h) { return '<li>' + h + '</li>'; }).join('') + '</ul>' +
          '<div class="gt4-params">' + d.params.map(function (p) { return '<div>' + p[0] + '：<b>' + p[1] + '</b></div>'; }).join('') + '</div>' +
          '<div class="gt4-btns"><button class="gt4-btn-sec" data-act="cart">加入购物车</button><button class="gt4-btn-pri" data-act="buy">立即购买</button></div>' +
          '</div></div>';
      }
      function openDetail(name, d) {
        openModal(detailHTML(d, name), function (m) {
          var main = m.querySelector('.gt4-gal-main');
          m.querySelectorAll('.gt4-thumbs img').forEach(function (t) {
            t.addEventListener('click', function () {
              main.src = t.src;
              m.querySelectorAll('.gt4-thumbs img').forEach(function (x) { x.classList.remove('on'); });
              t.classList.add('on');
            });
          });
          m.querySelector('[data-act="cart"]').addEventListener('click', function () { addToCart(name, d.price); });
          m.querySelector('[data-act="buy"]').addEventListener('click', function () {
            addToCart(name, d.price); closeAll(); setTimeout(openCheckout, 250);

      /* 商品卡：点卡片（非按钮）开详情 */
      document.addEventListener('click', function (e) {
        if (e.target.closest('button, a, .gt4-modal, .gt-drawer, .gt4-servicefab')) return;
        var card = e.target.closest('[data-gt-name]');
        if (card && P[card.dataset.gtName]) { openDetail(card.dataset.gtName, P[card.dataset.gtName]); return; }
        var bimg = e.target.closest('[data-gt4-bundle]');
        if (bimg && BUNDLES[bimg.dataset.gt4Bundle]) { openDetail(BUNDLES[bimg.dataset.gt4Bundle].name, BUNDLES[bimg.dataset.gt4Bundle]); }
      });

      /* ---- 卡片价格锚点（划线价 + 立省标） ---- */
      function buildPriceAnchors() {
        document.querySelectorAll('[data-gt-name]').forEach(function (card) {
          if (card.dataset.gt4done) return;
          var d = P[card.dataset.gtName];
          if (!d || !d.orig) return;
          card.dataset.gt4done = '1';
          var priceEl = null;
          card.querySelectorAll('*').forEach(function (n) {
            if (priceEl || n.children.length) return;
            if (/^¥[\d,]+$/.test((n.textContent || '').trim())) priceEl = n;
          });
          var tag = el('<div><div class="gt4-cardorig">市场参考价 ¥' + d.orig.toLocaleString() + '</div><span class="gt4-cardsave">立省 ¥' + (d.orig - d.price).toLocaleString() + '</span></div>');
          if (priceEl && priceEl.parentNode) priceEl.parentNode.insertBefore(tag, priceEl.nextSibling);
          else card.appendChild(tag);
        });
      }
      /* 场景套装卡：绑定 bundle 图片 → 详情 */
      function bindBundles() {
        document.querySelectorAll('#scenarios img[src*="bundle-"]').forEach(function (img) {
          var key = (img.getAttribute('src') || '').split('/').pop();
          if (!BUNDLES[key]) return;
          var host = img.closest('[data-gt4-bundle]');
          if (host) return;
          var cardEl = img;
          var up = img;
          for (var i = 0; i < 4; i++) {
            up = up.parentElement;
            if (!up) break;
            if ((up.textContent || '').indexOf('¥') > -1 && up.querySelector('img') === img) { cardEl = up; break; }
          }
          cardEl.setAttribute('data-gt4-bundle', key);
          cardEl.style.cursor = 'pointer';
        });
      }

      /* ---- 保障横幅 ---- */
      function buildTrustbar() {
        var bar = document.querySelector('.gt-shopbar');

        var tb = own(el('<div class="gt-trustbar"><span><i></i>顺丰包邮 · 满 ¥399 包邮</span><span><i></i>七天无理由退换</span><span><i></i>两年质保 · 全国联保</span><span><i></i>48 小时内发货 · 支持验货</span></div>'));

      /* ---- 购物车增强：支付说明 / 满减 / 搭配推荐 / 接管下单 ---- */
      var promoBox = null, saveBox = null, upsellBox = null;
      var SUGGESTS = ['纯钛旅行壶 800ml', '能量汤锅', '茶杯套装(4只)', '纯钛餐具套装', '咖啡杯套装(2只)', '养生焖壶'];
      function cartEnhance() {
        var drawer = document.querySelector('.gt-drawer');
        if (!drawer || drawer.dataset.gt4done) return;
        drawer.dataset.gt4done = '1';
        var note = drawer.querySelector('.gt-drawer-note');
        if (note) note.textContent = '支持微信 / 支付宝 / 对公转账 · 电子发票随单自动开具';
        var foot = drawer.querySelector('.gt-drawer-f');
        if (foot) {
          promoBox = own(el('<div class="gt4-promo"><span></span><div class="gt4-promo-bar"><i></i></div></div>'));
          saveBox = own(el('<div class="gt4-saverow" style="display:none"><span>满减优惠</span><b></b></div>'));
          foot.insertBefore(promoBox, foot.querySelector('.gt-checkout'));
          foot.insertBefore(saveBox, foot.querySelector('.gt-checkout'));
        }
        var list = drawer.querySelector('.gt-drawer-list');
        upsellBox = own(el('<div class="gt4-upsell" style="display:none"></div>'));
        if (list && list.parentNode) list.parentNode.insertBefore(upsellBox, list.nextSibling);
        /* 接管「立即下单」 */
        var btn = drawer.querySelector('.gt-checkout');
        if (btn) {
          var nb = btn.cloneNode(true);
          btn.parentNode.replaceChild(nb, btn);
          nb.addEventListener('click', function () {
            if (!readCart().length) { toast('购物车还是空的，先去挑一件钛宝贝吧'); return; }
            openCheckout();
          });
        }
        var mo = new MutationObserver(function () { updatePromo(); updateUpsell(); });
        mo.observe(drawer.querySelector('.gt-drawer-list'), { childList: true });
        mo.observe(drawer.querySelector('.gt-total b'), { childList: true, characterData: true, subtree: true });
        updatePromo(); updateUpsell();
      }
      function drawerTotal() {
        var b = document.querySelector('.gt-drawer .gt-total b');
        if (!b) return 0;
        var n = parseInt((b.textContent || '').replace(/[^\d]/g, ''), 10);
        return isNaN(n) ? 0 : n;
      }
      function updatePromo() {
        if (!promoBox) return;
        var t = drawerTotal();
        var hit = promoFor(t), nxt = nextPromo(t);
        var span = promoBox.querySelector('span'), fill = promoBox.querySelector('.gt4-promo-bar i');
        if (hit) {
          span.textContent = '已满足满 ¥' + hit.min.toLocaleString() + ' 减 ¥' + hit.cut + '，结算时自动抵扣';
          fill.style.width = '100%';
        } else if (nxt) {
          span.textContent = '还差 ¥' + (nxt.min - t).toLocaleString() + ' 即可减 ¥' + nxt.cut + '，加一件就够';
          fill.style.width = Math.min(100, Math.round(t / nxt.min * 100)) + '%';
        } else { span.textContent = '当前已享最优满减'; fill.style.width = '100%'; }
        if (saveBox) {
          if (hit) { saveBox.style.display = 'flex'; saveBox.querySelector('b').textContent = '- ¥' + hit.cut + '（满减）'; }
          else saveBox.style.display = 'none';
        }
      }
      function updateUpsell() {
        if (!upsellBox) return;
        var c = readCart();
        if (!c.length) { upsellBox.style.display = 'none'; return; }
        var names = c.map(function (i) { return i.name; });
        var pick = null;
        for (var i = 0; i < SUGGESTS.length; i++) {
          if (names.indexOf(SUGGESTS[i]) === -1 && P[SUGGESTS[i]]) { pick = SUGGESTS[i]; break; }
        }
        if (!pick) { upsellBox.style.display = 'none'; return; }
        var d = P[pick];
        upsellBox.style.display = 'flex';
        upsellBox.innerHTML = '<img src="' + d.img + '" alt=""><div class="t"><b>顺手带一件：' + pick + '</b>加购免运费门槛，凑单更划算</div><button>¥' + d.price.toLocaleString() + ' 加入</button>';
        upsellBox.querySelector('button').onclick = function () { addToCart(pick, d.price); updateUpsell(); updatePromo(); };
      }

      /* ---- 留资下单（收银台） ---- */
      function openCheckout() {
        var c = readCart();
        var t = c.reduce(function (s, i) { return s + i.price * i.qty; }, 0);
        var hit = promoFor(t);
        var pay = t - (hit ? hit.cut : 0);
        var itemsTxt = c.map(function (i) { return i.name + ' × ' + i.qty; }).join('；');
        openModal('<h3 class="gt4-title">确认订单</h3><div class="gt4-sub">填写收货信息，提交后品牌顾问将电话与您确认支付</div>' +
          '<div class="gt4-form">' +
          '<label>收货人姓名</label><input id="gt4-name" type="text" maxlength="20" placeholder="请输入姓名">' +
          '<label>手机号（用于订单查询与发货通知）</label><input id="gt4-phone" type="tel" maxlength="11" placeholder="请输入 11 位手机号">' +

          '<label>备注留言（选填）</label><textarea rows="2" maxlength="120" placeholder="刻字需求、配送偏好等"></textarea>' +

          '<label class="on"><input type="radio" name="gt4pay" value="微信支付" checked>微信支付</label>' +
          '<label><input type="radio" name="gt4pay" value="支付宝">支付宝</label>' +

          '<div class="gt4-sumline"><span>商品合计</span><span>¥' + t.toLocaleString() + '</span></div>' +
          (hit ? '<div class="gt4-sumline disc"><span>满减优惠（满 ¥' + hit.min.toLocaleString() + ' 减 ¥' + hit.cut + '）</span><span>- ¥' + hit.cut + '</span></div>' : '') +
          '<div class="gt4-sumline all"><span>应付金额</span><b>¥' + pay.toLocaleString() + '</b></div>' +

          '<div class="gt4-form"><label>手机号</label><input id="gt4-qphone" type="tel" maxlength="11" placeholder="请输入 11 位手机号" value="' + (prefill || '') + '">' +
          '<div class="gt4-btns" style="margin-top:16px"><button class="gt4-btn-pri" data-act="q">查询</button></div><div class="gt4-list"></div></div>', function (m) {
            var list = m.querySelector('.gt4-list');
            function q() {
              var phone = m.querySelector('#gt4-qphone').value.trim();
              if (!/^1\d{10}$/.test(phone)) { toast('请输入正确的 11 位手机号'); return; }
              var orders = [];
              try { orders = JSON.parse(localStorage.getItem('gt-orders') || '[]'); } catch (e) {}
              var mine = orders.filter(function (o) { return o.phone === phone; });

      /* 最内层元素精确文本匹配：本身文本等于目标、且没有子元素的文本也等于目标（图标等无关子元素不影响） */
      function deepFindByText(txt) {
        var out = [];
        document.body.querySelectorAll('div, span, button, p, b, i, a, h3, h4, li, summary, em, strong').forEach(function (n) {
          if (n.closest('[data-gt4-own]')) return;
          if ((n.textContent || '').trim() !== txt) return;
          var childHit = false;
          for (var i = 0; i < n.children.length; i++) {
            if (((n.children[i].textContent || '').trim()) === txt) { childHit = true; break; }
          }
          if (!childHit) out.push(n);
        });
        return out;
      }
      var certsBound = false;
      function bindCerts() {
        if (certsBound) return;
        var found = 0;
        Object.keys(CERT_MAP).forEach(function (label) {
          deepFindByText(label).forEach(function (host) {
            var clickHost = host;
            var p = host.parentElement;
            if (p && !p.closest('[data-gt4-own]') && p.children.length <= 3 && p !== document.body) clickHost = p;
            if (clickHost.getAttribute('data-gt4-cert')) return;
            clickHost.setAttribute('data-gt4-cert', '1');
            host.classList.add('gt4-certlink');
            var idx = CERT_MAP[label];
            clickHost.addEventListener('click', function (e) { e.stopPropagation(); openReports(idx); });
            found++;
          });
        });
        if (found) certsBound = true;
      }

        ['如何验证光体产品真伪？', '每件光体产品均配备一物一码专属溯源码，扫码即可查看 TDNS 材料批次、检测报告、生产工厂（康钛源 / 卡特马克）、质检报告及光体品牌授权，全链路透明可追溯。'],

        ['能量锅的 9.4μm 共振是什么意思？', '9.4μm 是水分子的最佳共振波段。光体星饪能量锅通过 TDNS 新材料产生该波段远红外线，与水分子产生共振效应，细化水分子团，激发食材原香、锁住营养。'],
        ['企业定制怎么联系？', '通过网站底部「定制智造服务」入口提交需求，涵盖企业礼品、联名合作、OEM 代工；B 端服务团队将在 24 小时内与您联系，提供专属定制方案。'],
